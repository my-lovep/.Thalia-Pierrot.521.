<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>爱恋</title>
<style>
:root{--bg:#f5f5f5;--chatbg:#ededed;--text:#111;--u:#333;--ut:#fff;--o:#fff;--ot:#111;--hbg:#f5f5f5;--border:#dcdcdc;--accent:#888;--font:"SimSun",serif;--fs:16px;}
[data-theme="dark"]{--bg:#000;--chatbg:#111;--text:#eee;--u:#555;--ut:#fff;--o:#222;--ot:#eee;--hbg:#111;--border:#333;--accent:#666;}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s;}
body{background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-size:var(--fs);user-select:none;}
svg{fill:currentColor;width:24px;height:24px;}img{object-fit:cover;}
.app-icon,.back-btn,.header-btn,.btn-icon,.btn-send,.panel-action,.action-btn,.emoji-tab-btn,.ask-tab,.btn-tool,.music-btn,.call-btn,.card-actions span,.list-item,.group-title,.setting-item .toggle,.profile-edit img,.call-minimize-btn,#call-mini-bar,#call-local-layer{touch-action:manipulation;cursor:pointer;}
#home{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:60px 20px 20px;align-content:start;height:100%;overflow-y:auto;}
.icon{background:var(--hbg);border-radius:24px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.05);border:1px solid var(--border);}
.icon span{font-size:13px;margin-top:10px;font-weight:bold;}.icon:active{transform:scale(.92);}
.page{display:none;flex-direction:column;height:100%;background:var(--bg);position:absolute;top:0;left:0;width:100%;z-index:10;}
.hd{padding:15px 20px;padding-top:max(15px,env(safe-area-inset-top));background:var(--hbg);display:flex;align-items:center;border-bottom:1px solid var(--border);font-weight:bold;font-size:17px;flex-shrink:0;}
.bk{margin-right:15px;padding:5px;display:flex;}.hr{display:flex;gap:15px;}.hb{padding:5px;display:flex;}
.chat-area{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:15px;background-color:var(--chatbg);background-size:cover;background-position:center;-webkit-overflow-scrolling:touch;}
.row{display:flex;width:100%;align-items:flex-start;gap:10px;flex-shrink:0;}.row.user{justify-content:flex-end;}
.avt{width:38px;height:38px;border-radius:6px;background:#ddd;object-fit:cover;}
.wrap{display:flex;flex-direction:column;max-width:75%;position:relative;}.row.user .wrap{align-items:flex-end;}
.name{font-size:12px;color:#888;margin-bottom:3px;}
.msg{padding:10px 14px;border-radius:12px;line-height:1.5;word-break:break-all;position:relative;border:1px solid transparent;}
.msg.user{background:var(--u);color:var(--ut);border-top-right-radius:2px;}
.msg.other{background:var(--o);color:var(--ot);border-top-left-radius:2px;border-color:var(--border);}
.msg img{max-width:100%;max-height:200px;border-radius:8px;margin-top:5px;display:block;background:rgba(0,0,0,.05);}
.sys{text-align:center;font-size:12px;color:#888;margin:10px 0;width:100%;}
.typing{font-size:12px;color:#888;padding:0 15px 10px;display:none;}
.inp{padding:10px 15px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--hbg);display:flex;gap:10px;align-items:center;border-top:1px solid var(--border);flex-shrink:0;}
.inp input{flex:1;padding:10px 15px;border:1px solid var(--border);border-radius:8px;outline:none;font-size:15px;background:var(--bg);color:var(--text);}
.btn{border:none;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;padding:5px;}
.send{padding:0;background:var(--u);color:var(--ut);border:none;border-radius:8px;width:50px;height:38px;font-weight:bold;}
#emoji-panel,#extra-panel{display:none;background:var(--hbg);border-top:1px solid var(--border);padding:15px;flex-shrink:0;}
#extra-panel{height:130px;gap:25px;overflow-x:auto;}
#emoji-panel{height:300px;flex-direction:column;padding:0;}
.panel-action{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;}
.ibox{width:60px;height:60px;background:var(--bg);border-radius:12px;border:1px solid var(--border);display:flex;justify-content:center;align-items:center;font-size:24px;}
.e-hd{display:flex;border-bottom:1px solid var(--border);padding:10px 15px;gap:15px;}
.e-btn{padding:6px 15px;border-radius:20px;font-size:14px;font-weight:bold;color:var(--accent);border:1px solid transparent;}
.e-btn.active{background:var(--bg);color:var(--text);border-color:var(--border);}
.e-area{flex:1;overflow-y:auto;padding:10px 15px;display:none;}
.e-area.active{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
.e-area img{width:calc(25% - 10px);aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:5px;}
.e-txt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:20px;text-align:center;}
.ls{flex:1;overflow-y:auto;padding:15px;padding-bottom:80px;}
.item{background:var(--hbg);padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.item-info{flex:1;overflow:hidden;}.item-title{font-weight:bold;font-size:15px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.item-desc{font-size:12px;color:#888;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.acts{display:flex;gap:8px;}.acts span{color:var(--accent);font-size:12px;cursor:pointer;}
.bar{position:absolute;bottom:0;left:0;width:100%;background:var(--hbg);padding:15px;padding-bottom:max(15px,env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--border);z-index:5;}
.bar input{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--bg);color:var(--text);}
.bar button{background:var(--u);color:var(--ut);border:none;border-radius:8px;padding:0 20px;font-size:15px;}
.set-c{padding:20px;overflow-y:auto;flex:1;padding-bottom:100px;}
.s-item{margin-bottom:20px;background:var(--hbg);padding:15px;border-radius:12px;border:1px solid var(--border);}
.s-item label{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:bold;font-size:14px;align-items:center;}
.s-item input[type="text"],.s-item input[type="number"],.s-item select,.s-item textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-top:5px;background:var(--bg);color:var(--text);font-size:14px;outline:none;}
.s-item textarea{resize:vertical;min-height:80px;}.s-item input[type="range"]{width:100%;margin:10px 0;}
.s-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.toggle{appearance:none;width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;outline:none;transition:.3s;cursor:pointer;}
.toggle:checked{background:#333;}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s;}
.toggle:checked::after{transform:translateX(20px);}
.profile-edit{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
.profile-edit img{width:45px;height:45px;border-radius:6px;background:#eee;border:1px solid var(--border);}
.profile-edit input[type="file"]{flex:1;font-size:12px;color:#666;}
.mk{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;pointer-events:none;}
.mk.show{display:flex;pointer-events:auto;}
.mc{background:var(--hbg);color:var(--text);width:90%;max-width:400px;border-radius:15px;padding:20px;display:flex;flex-direction:column;gap:15px;border:1px solid var(--border);max-height:85vh;overflow-y:auto;}
.mc textarea,.mc input,.mc select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;font-size:14px;}
.mc textarea{height:120px;resize:none;}
.mb{display:flex;gap:10px;}.mb button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;}
.c{background:var(--border);color:var(--text);}.ok{background:var(--u);color:var(--ut);}.danger{background:#444;color:#fff;}
#sheet{display:none;position:fixed;bottom:0;left:0;width:100%;background:var(--bg);z-index:210;border-top-left-radius:15px;border-top-right-radius:15px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--border);pointer-events:none;}
#sheet.show{display:block;pointer-events:auto;}
.act{padding:16px;text-align:center;border-bottom:1px solid var(--border);font-size:16px;}.ac{margin-top:8px;border:none;border-top:8px solid var(--border);font-weight:bold;}
.ask-tabs{display:flex;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:15px;border:1px solid var(--border);}
.ask-tab{flex:1;text-align:center;padding:8px 0;font-size:14px;cursor:pointer;border-radius:6px;color:var(--accent);font-weight:bold;}
.ask-tab.active{background:var(--hbg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.letter-content{white-space:pre-wrap;line-height:1.6;font-size:15px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);min-height:200px;}

/* 通话界面重构 */
#call{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:500;display:none;color:#fff;overflow:hidden;}
#call.show{display:block;}
#call-remote-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;background:#111;display:flex;align-items:center;justify-content:center;transition:all .3s;}
#call-local-layer{position:absolute;top:max(40px,env(safe-area-inset-top));right:20px;width:110px;height:160px;border-radius:12px;z-index:20;background:#222;border:1px solid #444;cursor:pointer;transition:all .3s;overflow:hidden;}
#lvid{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;}
#remote-info{display:flex;flex-direction:column;align-items:center;gap:20px;transition:all .3s;width:100%;}
#cavt{width:120px;height:120px;border-radius:50%;border:3px solid #333;object-fit:cover;transition:all .3s;}
.cname{font-size:24px;font-weight:bold;transition:all .3s;}
.cst{font-size:16px;color:#aaa;transition:all .3s;}
/* 切换后的样式 */
#call-local-layer.main{top:0;left:0;width:100%;height:100%;border-radius:0;z-index:10;border:none;}
#call-remote-layer.pip{top:max(40px,env(safe-area-inset-top));left:auto;right:20px;width:110px;height:160px;border-radius:12px;z-index:20;background:#222;border:1px solid #444;}
#call-remote-layer.pip #remote-info{gap:5px;}
#call-remote-layer.pip #cavt{width:44px;height:44px;border:none;}
#call-remote-layer.pip .cname{font-size:12px;}
#call-remote-layer.pip .cst{display:none;}

.cacts{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;padding:0 40px;z-index:50;}
.cbtn{width:60px;height:60px;border-radius:50%;color:#fff;border:none;font-size:16px;cursor:pointer;}
.min-btn{position:absolute;top:max(40px,env(safe-area-inset-top));z-index:50;background:rgba(0,0,0,.6);width:44px;height:44px;border-radius:50%;color:#fff;border:none;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;}
#mini{position:fixed;top:max(40px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--hbg);border-radius:30px;padding:8px 20px 8px 8px;display:none;align-items:center;gap:12px;z-index:600;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;}
#mini img{width:36px;height:36px;border-radius:50%;}
#mini span{color:var(--text);font-size:15px;}
#call-mini-bar{display:none;}
</style>
</head>
<body>
<audio id="keep-alive-audio" loop src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="></audio>
<audio id="global-audio" style="display:none;"></audio>

<div id="home">
<div class="app-icon" onclick="App.open('chat-app')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>聊天</span></div>
<div class="app-icon" onclick="App.open('cards-app')"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg><span>字卡库</span></div>
<div class="app-icon" onclick="App.open('pat-app')"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>拍一拍</span></div>
<div class="app-icon" onclick="App.open('emoji-app')"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2z"/></svg><span>表情包</span></div>
<div class="app-icon" onclick="App.open('letter-app')"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg><span>信箱</span></div>
<div class="app-icon" onclick="App.open('music-app')"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg><span>音乐</span></div>
<div class="app-icon" onclick="App.open('settings-app')"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg><span>设置</span></div>
</div>

<!-- 聊天 -->
<div id="chat-app" class="page">
<div class="hd"><div class="bk" data-close="chat-app"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><div style="flex:1;" id="chat-title">对方</div><div class="hr"><div class="hb" onclick="Call.start(false)"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div><div class="hb" onclick="Call.start(true)"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div><div class="hb" onclick="Chat.clear()"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></div></div></div>
<div class="chat-area" id="chat-area"></div>
<div class="typing" id="typing-status">对方正在输入...</div>
<div id="emoji-panel">
<div class="e-hd"><div class="e-btn active" data-tab="pic">表情包</div><div class="e-btn" data-tab="emo">Emoji</div><div class="e-btn" data-tab="txt">颜文字</div><div style="flex:1;"></div><div onclick="App.closeAllOverlays()">✕</div></div>
<div style="display:flex;justify-content:flex-end;padding:5px 15px;" id="e-add-pic"><button class="e-btn" onclick="Emoji.showMenu()">加图片</button></div>
<div class="e-area active" id="e-area-pic"></div><div class="e-area" id="e-area-emo"></div><div class="e-area" id="e-area-txt"></div>
</div>
<div id="extra-panel">
<div class="panel-action" onclick="document.getElementById('img-upload').click()"><div class="ibox">📷</div><span>相册</span></div>
<div class="panel-action" onclick="App.closeAllOverlays(); document.getElementById('ask-modal').classList.add('show')"><div class="ibox">❓</div><span>问问TA</span></div>
<div class="panel-action" onclick="App.closeAllOverlays(); Chat.openMoney('red')"><div class="ibox">🧧</div><span>红包</span></div>
<div class="panel-action" onclick="App.closeAllOverlays(); Chat.openMoney('transfer')"><div class="ibox">💸</div><span>转账</span></div>
</div>
<input type="file" id="img-upload" accept="image/*" style="display:none" onchange="Chat.sendImg(this)">
<div id="quote-preview" style="display:none;background:var(--hbg);padding:8px 15px;font-size:13px;color:#666;border-top:1px solid var(--border);align-items:center;justify-content:space-between;flex-shrink:0;"><span id="quote-text"></span><button onclick="Chat.quoteMsg=null;this.parentElement.style.display='none'" style="background:none;border:none;color:var(--text);">✕</button></div>
<div class="inp"><button class="btn" onclick="App.togglePanel('emoji-panel')">😀</button><input type="text" id="msg-input" placeholder=""><button class="btn" onclick="App.togglePanel('extra-panel')">➕</button><button class="btn" onclick="Chat.triggerReply('',true)">⋯</button><button class="send" onclick="Chat.sendMsg()">发送</button></div>
</div>

<!-- 字卡库 -->
<div id="cards-app" class="page">
<div class="hd"><div class="bk" data-close="cards-app"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><div style="flex:1;">字卡库</div></div>
<div style="padding:10px;"><input type="text" id="search-input" oninput="Cards.render()" placeholder="搜索..." style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);"></div>
<div style="padding:10px;display:flex;gap:8px;"><button class="e-btn" onclick="document.getElementById('batch-modal').classList.add('show')" style="flex:1;background:var(--bg);border:1px solid var(--border);">批量添加</button></div>
<div class="ls" id="cards-list"></div>
<div class="bar"><input type="text" id="new-card" placeholder="单条添加..."><button onclick="Cards.add()">添加</button></div>
</div>

<!-- 拍一拍 -->
<div id="pat-app" class="page">
<div class="hd"><div class="bk" data-close="pat-app"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><div style="flex:1;">拍一拍</div></div>
<div style="padding:10px;display:flex;gap:8px;"><button class="e-btn" onclick="document.getElementById('pat-batch-modal').classList.add('show')" style="flex:1;background:var(--bg);border:1px solid var(--border);">批量添加</button></div>
<div class="ls" id="pat-list"></div>
<div class="bar"><input type="text" id="new-pat" placeholder="添加词条..."><button onclick="Pat.add()">添加</button></div>
</div>

<!-- 表情包 -->
<div id="emoji-app" class="page">

<script>
const DB_KEY = 'love_app_v3';
const $ = id => document.getElementById(id);

const App = {
    data: { msgs: [], cards: [], pats: [], emojis: { pic: [], emo: [], txt: [] }, letters: [], music: [], wallet: { my: 520.22, bot: 100 }, settings: {} },
    audioCtx: null,
    init() {
        const defaultSettings = {
            myName: '我', myAvatar: '', botName: '对方', botAvatar: '',
            showAvatar: true, showName: true, showRead: true, soundEnabled: true,
            theme: 'system', fontSize: 16, bubbleCss: '', bgImage: '', timeDisplay: 'bottom', fontUrl: '',
            delayMin: 2, delayMax: 5, proactiveMin: 0, proactiveMax: 0,
            ignoreProb: 20, quoteProb: 30, patProb: 10, callProb: 5, answerProb: 80, hangupProb: 10,
            letterMin: 0, letterMax: 0, letterProb: 10, replyProb: 80,
            desktopNotify: false, keepAlive: false, giveProb: 10, receiveProb: 80, returnProb: 20
        };
        try {
            const stored = localStorage.getItem(DB_KEY);
            if (stored) {
                const parsed = JSON.parse(stored);
                this.data.msgs = parsed.msgs || [];
                this.data.cards = parsed.cards || [{ group: '默认', items: ['你好'], collapsed: false }];
                this.data.pats = parsed.pats || ['拍了拍', '抱了抱你'];
                this.data.emojis = parsed.emojis || { pic: [], emo: ['😀','😃','😄','😁','😆'], txt: ['(￣▽￣)','(✿◡‿◡)'] };
                this.data.letters = parsed.letters || [];
                this.data.music = parsed.music || [];
                this.data.wallet = parsed.wallet || { my: 520.22, bot: 100 };
                this.data.settings = { ...defaultSettings, ...parsed.settings };
            } else {
                this.data.cards = [{ group: '默认', items: ['你好'], collapsed: false }];
                this.data.pats = ['拍了拍', '抱了抱你'];
                this.data.emojis = { pic: [], emo: ['😀','😃','😄','😁','😆'], txt: ['(￣▽￣)','(✿◡‿◡)'] };
                this.data.settings = defaultSettings;
            }
        } catch (e) {
            console.error('Data load error', e);
            location.reload();
        }
        this.applyStyles();
    },
    saveData() {
        localStorage.setItem(DB_KEY, JSON.stringify(this.data));
    },
    open(id) {
        this.closeAllOverlays();
        $(id).style.display = 'flex';
        if (id === 'chat-app') Chat.render();
        if (id === 'cards-app') Cards.render();
        if (id === 'pat-app') Pat.render();
        if (id === 'emoji-app') Emoji.renderMgr();
        if (id === 'letter-app') Letters.render();
        if (id === 'music-app') Music.render();
        if (id === 'settings-app') Settings.render();
    },
    closeApp(id) {
        $(id).style.display = 'none';
        this.closeAllOverlays();
    },
    closeAllOverlays() {
        $('emoji-panel').style.display = 'none';
        $('extra-panel').style.display = 'none';
        $('sheet').classList.remove('show');
        document.querySelectorAll('.mk').forEach(m => m.classList.remove('show'));
    },
    closeModal(id) {
        $(id).classList.remove('show');
    },
    togglePanel(id) {
        const p = $(id), isNone = p.style.display === 'none' || !p.style.display;
        $('emoji-panel').style.display = 'none';
        $('extra-panel').style.display = 'none';
        if (isNone) p.style.display = 'flex';
        if (id === 'emoji-panel') Emoji.renderPanel();
    },
    toast(msg) {
        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;pointer-events:none;';
        el.innerText = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    },
    applyStyles() {
        const s = this.data.settings;
        document.documentElement.style.setProperty('--fs', s.fontSize + 'px');
        if (s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (s.theme === 'light') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        
        let fs = $('dynamic-font-style');
        if (s.fontUrl) {
            if (s.fontUrl.startsWith('http') || s.fontUrl.startsWith('@')) fs.innerHTML = s.fontUrl.startsWith('@') ? s.fontUrl : `@import url('${s.fontUrl}');`;
            else document.documentElement.style.setProperty('--font', s.fontUrl);
        } else {
            fs.innerHTML = '';
            document.documentElement.style.setProperty('--font', '"SimSun", serif');
        }
        
        $('dynamic-bubble-style').innerHTML = s.bubbleCss ? `.msg.user { ${s.bubbleCss} }` : '';
        const area = $('chat-area');
        if (s.bgImage) area.style.backgroundImage = `url(${s.bgImage})`;
        else area.style.backgroundImage = 'none';
        
        $('chat-title').innerText = s.botName;
    },
    exportData() {
        const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'love_backup.json';
        a.click();
    },
    importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const d = JSON.parse(e.target.result);
                this.data = d;
                this.saveData();
                location.reload();
            } catch (err) { this.toast('文件格式错误'); }
        };
        reader.readAsText(file);
    }
};

// 聊天
const Chat = {
    quoteMsg: null,
    init() {
        document.addEventListener('click', e => {
            if (e.target.closest('[data-close]')) App.closeApp(e.target.closest('[data-close]').dataset.close);
            if (e.target.closest('[data-close-modal]')) App.closeModal(e.target.closest('[data-close-modal]').dataset.closeModal);
            if (e.target.classList.contains('mk')) e.target.classList.remove('show');
        });
        document.addEventListener('touchstart', () => {
            if (!App.audioCtx) App.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            else if (App.audioCtx.state === 'suspended') App.audioCtx.resume();
        }, { once: true });
        
        document.querySelectorAll('.ask-tab').forEach(tab => {
            tab.onclick = function() {
                document.querySelectorAll('.ask-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const type = this.dataset.ask;
                $('ask-single').style.display = type === 'single' ? 'block' : 'none';
                $('ask-multi').style.display = type === 'multi' ? 'block' : 'none';
                $('ask-text').style.display = type === 'text' ? 'block' : 'none';
            };
        });
        document.querySelectorAll('#emoji-panel .e-btn[data-tab]').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('#emoji-panel .e-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('#emoji-panel .e-area').forEach(a => a.classList.remove('active'));
                this.classList.add('active');

                $('e-add-pic').style.display = this.dataset.tab === 'pic' ? 'flex' : 'none';
                Emoji.renderPanel();
            };
        });
    },
    render() {
        const area = $('chat-area'), s = App.data.settings;
        area.innerHTML = '';
        App.data.msgs.forEach((m, i) => {
            if (m.role === 'system') {
                area.innerHTML += `<div class="sys">${m.content}</div>`;
                return;
            }
            const isMe = m.role === 'user';
            const avt = isMe ? s.myAvatar : s.botAvatar;
            const name = isMe ? s.myName : s.botName;
            const avH = s.showAvatar ? `<img class="avt" src="${avt || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ccc\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'}">` : '';
            const nameH = s.showName ? `<div class="name">${name}</div>` : '';
            const readH = (isMe && s.showRead) ? `<div style="font-size:11px;color:#999;text-align:right;margin-top:2px;">已读</div>` : '';
            let timeH = '';
            if (s.timeDisplay === 'bottom') timeH = `<div style="font-size:11px;color:#999;margin-top:4px;text-align:center;">${new Date(m.id).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
            
            let cH = '';
            if (m.type === 'red' || m.type === 'transfer') {
                cH = `<div class="msg ${m.role}" style="background:${m.type==='red'?'#fa5151':'#fa9d3b'};color:#fff;padding:15px;border-radius:10px;width:200px;cursor:pointer;" onclick="Chat.openCard(${i})"><div style="font-size:24px;">${m.type==='red'?'🧧':'💸'}</div><div>${m.note}</div><div>¥${m.amount}</div><div style="font-size:12px;margin-top:5px;">${m.status==='opened'?'已领取':'点击领取'}</div></div>`;
            } else if (m.type === 'survey') {
                cH = `<div class="msg ${m.role}" style="padding:15px;"><b>${m.q}</b><br><br>${m.opts.map(o=>`<div style="border:1px solid var(--border);padding:5px;margin-bottom:5px;border-radius:5px;${o.sel?'background:var(--hbg)':''}">${o.t} ${o.sel?'✓':''}</div>`).join('')}</div>`;
            } else {
                cH = `<div class="msg ${m.role}" onclick="Chat.showActions(${i})">${m.isImg ? `<img src="${m.c}">` : m.c}</div>`;
            }
            area.innerHTML += `<div class="row ${m.role}">${!isMe?avH:''}<div class="wrap">${nameH}${cH}${timeH}${readH}</div>${isMe?avH:''}</div>`;
        });
        area.scrollTop = area.scrollHeight;
    },
    sendMsg() {
        const input = $('msg-input'), text = input.value.trim();
        if (!text) return;
        const msg = { id: Date.now(), role: 'user', c: text };
        if (this.quoteMsg) { msg.quote = this.quoteMsg.c; this.quoteMsg = null; $('quote-preview').style.display = 'none'; }
        App.data.msgs.push(msg);
        input.value = '';
        App.saveData(); this.render(); this.playSound(); this.triggerReply(text);
    },
    sendImg(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            App.data.msgs.push({ id: Date.now(), role: 'user', isImg: true, c: e.target.result });
            App.saveData(); this.render(); this.playSound(); this.triggerReply('[图片]');
        };
        reader.readAsDataURL(file);
        input.value = '';
    },
    triggerReply(txt, isPro = false) {
        const s = App.data.settings;
        if (!isPro && Math.random() * 100 < s.ignoreProb) return;
        
        const delay = (Math.random() * (s.delayMax - s.delayMin) + s.delayMin) * 1000;
        $('typing-status').style.display = 'block';
        
        setTimeout(() => {
            $('typing-status').style.display = 'none';
            let replyText = '嗯。';
            const items = App.data.cards.flatMap(c => c.items);
            if (items.length) replyText = items[Math.floor(Math.random() * items.length)];
            
            const msg = { id: Date.now(), role: 'other', c: replyText };
            if (!isPro && txt && Math.random() * 100 < s.quoteProb) {
                msg.quote = txt;
            }
            App.data.msgs.push(msg);
            App.saveData(); this.render(); this.playSound();
            
            if (document.hidden && s.desktopNotify && Notification.permission === 'granted') {
                new Notification(s.botName, { body: replyText });
            }
        }, delay);
    },
    playSound() {
        if (!App.data.settings.soundEnabled || !App.audioCtx) return;
        const osc = App.audioCtx.createOscillator(), gain = App.audioCtx.createGain();
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, App.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, App.audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(App.audioCtx.destination);
        osc.start(); osc.stop(App.audioCtx.currentTime + 0.1);
    },
    showActions(i) {
        const m = App.data.msgs[i], sheet = $('sheet'), content = $('sheet-content');
        content.innerHTML = '';
        if (m.role === 'user' && !m.isImg && m.type !== 'survey') {
            content.innerHTML += `<div class="act" onclick="Chat.addCard('${m.c.replace(/'/g, "\\'")}')">加入字卡库</div>`;
        }
        if (m.type !== 'survey') {
            content.innerHTML += `<div class="act" onclick="Chat.quote(${i})">引用</div>`;
        }
        content.innerHTML += `<div class="act" style="color:#fa5151" onclick="App.data.msgs.splice(${i},1);App.saveData();Chat.render();App.closeAllOverlays();">删除</div>`;
        content.innerHTML += `<div class="act ac" onclick="App.closeAllOverlays()">取消</div>`;
        sheet.classList.add('show');
    },
    addCard(txt) {
        App.data.cards[0].items.push(txt);
        App.saveData(); App.toast('已加入字卡库'); App.closeAllOverlays();
    },
    quote(i) {
        this.quoteMsg = App.data.msgs[i];
        $('quote-text').innerText = this.quoteMsg.isImg ? '[图片]' : this.quoteMsg.c;
        $('quote-preview').style.display = 'flex';
        App.closeAllOverlays();
    },
    clear() {
        if (confirm('清空聊天记录？')) { App.data.msgs = []; App.saveData(); this.render(); }
    },
    openMoney(type) {
        $('money-modal').dataset.type = type;
        $('money-amount').value = ''; $('money-note').value = '';
        $('money-modal').classList.add('show');
    },
    doMoney() {
        const amt = parseFloat($('money-amount').value), note = $('money-note').value, type = $('money-modal').dataset.type;
        if (!amt || amt <= 0) return App.toast('请输入正确金额');
        if (App.data.wallet.my < amt) return App.toast('余额不足');
        App.data.wallet.my = (App.data.wallet.my - amt).toFixed(2);
        App.data.msgs.push({ id: Date.now(), role: 'user', type, amount: amt.toFixed(2), note: note || '恭喜发财', status: 'unread' });
        App.closeModal('money-modal'); App.saveData(); this.render();
        setTimeout(() => {
            if (Math.random() * 100 < App.data.settings.receiveProb) {
                App.data.wallet.bot = (parseFloat(App.data.wallet.bot) + amt).toFixed(2);
                App.data.msgs.push({ id: Date.now(), role: 'other', type, amount: amt.toFixed(2), note: '已收款', status: 'opened' });
                App.data.msgs.push({ role: 'system', content: `对方已收下你的${type==='red'?'红包':'转账'}` });
            } else {
                App.data.wallet.my = (parseFloat(App.data.wallet.my) + amt).toFixed(2);
                App.data.msgs.push({ role: 'system', content: `对方退回了你的${type==='red'?'红包':'转账'}` });
            }
            App.saveData(); this.render();
        }, 2000);
    },
    openCard(i) {
        const m = App.data.msgs[i];
        if (m.status === 'opened') return App.toast('已领取');
        if (m.role === 'user') return App.toast('等待对方领取');
        m.status = 'opened';
        App.data.wallet.my = (parseFloat(App.data.wallet.my) + parseFloat(m.amount)).toFixed(2);
        App.data.msgs.push({ role: 'system', content: `你已领取 ${m.amount} 元` });
        App.saveData(); this.render();
    },
    sendSurvey() {
        const q = $('ask-q').value.trim(), activeTab = document.querySelector('.ask-tab.active').dataset.ask;
        if (!q) return App.toast('请输入问题');
        let opts = [], isText = false;
        if (activeTab === 'single') {
            const lines = $('ask-opt-single').value.split('\n').filter(x => x.trim());
            if (lines.length < 2) return App.toast('至少两个选项');
            opts = lines.map(t => ({ t, sel: false }));
        } else if (activeTab === 'multi') {
            const lines = $('ask-opt-multi').value.split('\n').filter(x => x.trim());
            if (lines.length < 2) return App.toast('至少两个选项');
            opts = lines.map(t => ({ t, sel: false }));
        } else { isText = true; }
        
        const msgId = Date.now();
        App.data.msgs.push({ id: msgId, role: 'user', type: 'survey', q, opts, isText, done: false });
        $('ask-q').value = ''; $('ask-opt-single').value = ''; $('ask-opt-multi').value = '';
        App.closeModal('ask-modal'); App.saveData(); this.render();
        
        setTimeout(() => {
            const m = App.data.msgs.find(x => x.id === msgId);
            if (m) {
                m.done = true;
                if (isText) {
                    const items = App.data.cards.flatMap(c => c.items);
                    m.selectedText = items.length ? items[0] : '不知道';
                } else {
                    m.opts[0].sel = true;
                }
                App.saveData(); this.render();
            }
        }, 3000);
    }
};

// 字卡库
const Cards = {
    render() {
        const search = $('search-input').value.toLowerCase();
        let html = '';

            const items = g.items.filter(i => i.toLowerCase().includes(search));
            if (!items.length && search) return;
            html += `<div class="item" style="flex-direction:column;align-items:stretch;padding:10px;"><div style="font-weight:bold;margin-bottom:5px;display:flex;justify-content:space-between;"><span>${g.group} (${items.length})</span><span onclick="Cards.delGroup(${gi})" style="color:#fa5151;font-size:12px;">删除分组</span></div>`;
            items.forEach((it) => {
                html += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);"><span>${it}</span><span onclick="Cards.delItem(${gi},'${it.replace(/'/g,"\\'")}')" style="color:#fa5151;font-size:12px;">删除</span></div>`;
            });
            html += `</div>`;
        });
        $('cards-list').innerHTML = html || '<div style="text-align:center;padding:20px;color:#999;">暂无字卡</div>';
    },
    add() {
        const v = $('new-card').value.trim();
        if (!v) return;
        App.data.cards[0].items.push(v);
        $('new-card').value = '';
        App.saveData(); this.render();
    },
    delGroup(gi) {
        if (confirm('删除分组及所有内容？')) { App.data.cards.splice(gi, 1); App.saveData(); this.render(); }
    },
    delItem(gi, it) {
        App.data.cards[gi].items = App.data.cards[gi].items.filter(x => x !== it);
        App.saveData(); this.render();
    },
    doBatch() {
        const txt = $('batch-txt').value;
        let currentGroup = '默认';
        txt.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            const match = line.match(/^【(.*?)】(.*)$/);
            if (match) { currentGroup = match[1]; line = match[2].trim(); if (!line) return; }
            let g = App.data.cards.find(c => c.group === currentGroup);
            if (!g) { g = { group: currentGroup, items: [] }; App.data.cards.push(g); }
            if (!g.items.includes(line)) g.items.push(line);
        });
        $('batch-txt').value = '';
        App.closeModal('batch-modal'); App.saveData(); this.render();
    }
};

                if(id==='pat-prob') k='patProb'; if(id==='call-prob') k='callProb'; if(id==='answer-prob') k='answerProb'; if(id==='hangup-prob') k='hangupProb'; if(id==='letter-prob') k='letterProb'; if(id==='reply-prob') k='replyProb';
                el.value = s[k]; v.innerText = s[k] + '%';
            }
        });
        
        $('set-my-avatar').onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { s.myAvatar = ev.target.result; $('my-avatar-preview').src = s.myAvatar; App.saveData(); }; r.readAsDataURL(f); } };
        $('set-bot-avatar').onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { s.botAvatar = ev.target.result; $('bot-avatar-preview').src = s.botAvatar; App.saveData(); }; r.readAsDataURL(f); } };
        $('set-bg').onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { s.bgImage = ev.target.result; App.saveData(); App.applyStyles(); }; r.readAsDataURL(f); } };
    },
    sliderChange(id) { const el = $('slider-'+id); $('val-'+id).innerText = el.value + (id==='font'?'px':'%'); },
    save() {
        const s = App.data.settings, w = App.data.wallet;
        w.my = parseFloat($('set-my-balance').value) || 0; w.bot = parseFloat($('set-bot-balance').value) || 0;
        s.myName = $('set-my-name').value; s.botName = $('set-bot-name').value;
        s.desktopNotify = $('set-desktop-notify').checked; s.keepAlive = $('set-keep-alive').checked;
        s.timeDisplay = $('set-time-display').value; s.showAvatar = $('set-show-avatar').checked;
        s.showName = $('set-show-name').checked; s.showRead = $('set-show-read').checked;
        s.soundEnabled = $('set-sound-enabled').checked; s.theme = $('set-theme').value;
        s.fontSize = parseInt($('slider-font-size').value); s.fontUrl = $('set-font-url').value;
        s.bubbleCss = $('set-bubble-css').value; s.delayMin = parseInt($('set-delay-min').value)||1;
        s.delayMax = parseInt($('set-delay-max').value)||5; s.proactiveMin = parseInt($('set-proactive-min').value)||0;
        s.proactiveMax = parseInt($('set-proactive-max').value)||0; s.letterMin = parseInt($('set-letter-min').value)||0;
        s.letterMax = parseInt($('set-letter-max').value)||0;
        
        ['give','receive','return','ignore','quote','pat-prob','call-prob','answer-prob','hangup-prob','letter-prob','reply-prob'].forEach(id => {
            const el = $('slider-' + id);
            if (el) {
                let k = id.replace('-prob','Prob').replace('-','');
                if(id==='pat-prob') k='patProb'; if(id==='call-prob') k='callProb'; if(id==='answer-prob') k='answerProb'; if(id==='hangup-prob') k='hangupProb'; if(id==='letter-prob') k='letterProb'; if(id==='reply-prob') k='replyProb';
                s[k] = parseInt(el.value);
            }
        });
        App.saveData(); App.applyStyles(); App.toast('设置已保存');
    }
};

// 通话界面逻辑
const Call = {
    isVideo: false, timer: null, sec: 0, stream: null, mode: 'user', videoEnabled: false,
    start(video) {
        this.isVideo = video;
        this.videoEnabled = false;
        this.sec = 0;
        App.closeAllOverlays();
        $('call').classList.add('show');
        
        $('call-remote-layer').classList.remove('pip');
        $('call-local-layer').classList.remove('main');
        $('lvid').style.display = 'none';
        
        $('cavt').src = App.data.settings.botAvatar || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
        $('cname').innerText = App.data.settings.botName;
        $('cst').innerText = '正在呼叫...';
        
        $('call-actions').innerHTML = `<button class="cbtn" style="background:#ff3b30;width:100px;border-radius:30px;" onclick="Call.hangup()" id="btn-hangup">取消</button>`;
        $('btn-cam').style.display = this.isVideo ? 'flex' : 'none';
        $('btn-switch-cam').style.display = 'none';
        
        setTimeout(() => {
            $('cst').innerText = '00:00';
            $('btn-hangup').innerText = '挂断';
            $('btn-hangup').style.width = '60px';
            $('btn-hangup').style.borderRadius = '50%';
            this.timer = setInterval(() => {
                this.sec++;
                $('cst').innerText = Math.floor(this.sec/60).toString().padStart(2,'0') + ':' + (this.sec%60).toString().padStart(2,'0');
            }, 1000);
            if (this.isVideo) this.toggleCam(); // 自动开一次
        }, 3000);
    },
    toggleCam() {
        if (!this.videoEnabled) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: this.mode } }).then(s => {
                this.stream = s;
                this.videoEnabled = true;
                $('lvid').srcObject = s;
                $('lvid').style.display = 'block';
                $('btn-switch-cam').style.display = 'flex';
            }).catch(e => App.toast('无法打开摄像头'));
        } else {
            this.videoEnabled = false;
            if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
            $('lvid').style.display = 'none';
            $('call-local-layer').classList.remove('main');
            $('call-remote-layer').classList.remove('pip');
            $('btn-switch-cam').style.display = 'none';
        }
    },
    switchCam() {
        this.mode = this.mode === 'user' ? 'environment' : 'user';
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        this.toggleCam();
    },
    toggleView() {
        const r = $('call-remote-layer'), l = $('call-local-layer');
        if (l.classList.contains('main')) {
            l.classList.remove('main');
            r.classList.remove('pip');
        } else {
            l.classList.add('main');
            r.classList.add('pip');
        }
    },
    hangup() {
        clearInterval(this.timer);
        if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
        $('call').classList.remove('show');
        $('mini').style.display = 'none';
    },
    minimize() {
        $('call').classList.remove('show');
        $('mini').style.display = 'flex';
        $('mini-avatar').src = App.data.settings.botAvatar || '';
    },
    expand() {
        $('mini').style.display = 'none';
        $('call').classList.add('show');
    }
};

App.init();
Chat.init();
</script>
