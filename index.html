<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>爱恋</title>
    <style>
        :root {
            --bg-color: #f5f5f5; --chat-bg: #ededed; --text-color: #111;
            --bubble-user: #333; --bubble-user-text: #fff;
            --bubble-other: #fff; --bubble-other-text: #111;
            --header-bg: #f5f5f5; --border-color: #dcdcdc; --font-size-base: 16px;
            --accent: #888;
            --custom-font: "SimSun", "Songti SC", serif;
        }
        [data-theme="dark"] {
            --bg-color: #000; --chat-bg: #111; --text-color: #eee;
            --bubble-user: #555; --bubble-user-text: #fff;
            --bubble-other: #222; --bubble-other-text: #eee;
            --header-bg: #111; --border-color: #333; --accent: #666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--custom-font); transition: background 0.2s, color 0.2s; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; font-size: var(--font-size-base); user-select: none; -webkit-user-select: none; }
        svg { fill: currentColor; width: 24px; height: 24px; }
        img { object-fit: cover; }

        /* 页面布局 */
        #home-screen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 50px 20px; align-content: start; height: 100%; overflow-y: auto; }
        .app-icon { background: var(--header-bg); border-radius: 20px; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid var(--border-color); }
        .app-icon:active { transform: scale(0.92); }
        .app-icon span { font-size: 13px; margin-top: 8px; font-weight: bold; }

        .page { display: none; flex-direction: column; height: 100%; background: var(--bg-color); position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
        .page.active { display: flex; }
        .header { padding: 15px 20px; padding-top: max(15px, env(safe-area-inset-top)); background: var(--header-bg); display: flex; align-items: center; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 17px; flex-shrink: 0; }
        .back-btn { margin-right: 15px; cursor: pointer; padding: 5px; display: flex; align-items: center;}
        .header-right { display: flex; gap: 15px; align-items: center;}
        .header-btn { cursor:pointer; padding: 5px; display: flex; align-items: center;}

        /* 聊天区域 */
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background-color: var(--chat-bg); background-size: cover; -webkit-overflow-scrolling: touch; }
        .msg-row { display: flex; width: 100%; align-items: flex-start; gap: 10px; flex-shrink: 0; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }
        
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap:4px; flex-shrink:0; width: 38px;}
        .avatar { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: #ddd; cursor: pointer; }
        .msg-time-avatar { font-size: 10px; color: #999; text-align: center; line-height: 1; margin-top: 2px; }

        .msg-content-wrapper { display: flex; flex-direction: column; max-width: 70%; position: relative; }
        .msg-row.user .msg-content-wrapper { align-items: flex-end; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .msg-row.user .msg-header { justify-content: flex-end; }
        .msg-name { font-size: 12px; color: #888; margin-left: 2px; }

        /* 气泡基础样式 */
        .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.5; word-break: break-all; position: relative; cursor: pointer; border: 1px solid transparent; }
        .msg.user { background: var(--bubble-user); color: var(--bubble-user-text); border-top-right-radius: 2px; }
        .msg.other { background: var(--bubble-other); color: var(--bubble-other-text); border-top-left-radius: 2px; border-color: var(--border-color); }
        .msg.quote { font-size: 12px; opacity: 0.6; border-left: 2px solid var(--accent); padding-left: 8px; margin-bottom: 5px; display: block; background: rgba(128,128,128,0.05); }
        .msg img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 5px; display: block; }
        
        .msg-time-bottom { font-size: 11px; color: #999; margin-top: 4px; display: none; text-align: center; }
        .msg-time-bottom.show { display: block; }
        .read-status { font-size: 11px; color: #999; text-align: right; margin-top: 2px; display: none; }
        .read-status.show { display: block; }
        .typing-status { font-size: 12px; color: #888; padding: 0 15px 10px; display: none; flex-shrink: 0; }
        .sys-msg { text-align: center; font-size: 12px; color: #888; margin: 10px 0; width: 100%; flex-shrink: 0; }

        /* 输入框 */
        .input-area { padding: 10px 15px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--header-bg); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .input-area input { flex: 1; padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; font-size: 15px; background: var(--bg-color); color: var(--text-color); }
        .btn-icon { border: none; background: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .btn-send { padding: 0; background: var(--bubble-user); color: var(--bubble-user-text); border: none; border-radius: 8px; width: 50px; height: 38px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; }

        /* 弹窗和菜单 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--header-bg); color: var(--text-color); width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border-color); }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: var(--bg-color); color: var(--text-color); }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .btn-cancel { background: var(--border-color); color: var(--text-color); }
        .btn-confirm { background: var(--bubble-user); color: var(--bubble-user-text); }

        #action-sheet { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-color); z-index: 210; border-top-left-radius: 15px; border-top-right-radius: 15px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border-color); }
        #action-sheet.show { display: block; }
        .action-btn { padding: 16px; text-align: center; font-size: 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-color); }
        .action-btn.danger { color: #ff3b30; }
        .action-cancel { margin-top: 8px; border-bottom: none; border-top: 8px solid var(--border-color); font-weight: bold; }

        /* 面板 */
        #emoji-panel { display: none; background: var(--header-bg); border-top: 1px solid var(--border-color); padding: 15px; height: 250px; flex-direction: column; }
        #emoji-panel.show { display: flex; }
        .emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; flex: 1; }
        .emoji-grid img { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); padding: 5px; }

        /* 设置列表 */
        .settings-content { padding: 20px; overflow-y: auto; flex: 1; padding-bottom: 100px; }
        .setting-item { margin-bottom: 20px; background: var(--header-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .setting-item label { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        .setting-item input[type="text"], .setting-item input[type="number"], .setting-item select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 5px; background: var(--bg-color); color: var(--text-color); }
        .setting-item input[type="range"] { width: 100%; margin: 10px 0; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .toggle { appearance: none; width: 44px; height: 24px; background: #ddd; border-radius: 12px; position: relative; outline: none; }
        .toggle:checked { background: #333; }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle:checked::after { transform: translateX(20px); }

        /* 音乐控制 */
        .music-player { padding: 20px; background: var(--header-bg); text-align: center; }
        .music-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .music-progress { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 15px; }
        .music-progress input { flex: 1; }
        .music-controls { display: flex; justify-content: center; gap: 25px; }
        .music-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-color); }
        .music-btn#btn-play { font-size: 36px; }
        .list-container { flex: 1; overflow-y: auto; padding: 15px; }
        .card-item { background: var(--header-bg); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <!-- 页面1：主页 -->
    <div id="home-screen">
        <div class="app-icon" onclick="App.openApp('chat-app')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" /></svg><span>聊天</span></div>
        <div class="app-icon" onclick="App.openApp('music-app')"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" /></svg><span>音乐</span></div>
        <div class="app-icon" onclick="App.openApp('settings-app')"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" /></svg><span>设置</span></div>
    </div>

    <!-- 页面2：聊天 -->
    <div id="chat-app" class="page">
        <div class="header">
            <div class="back-btn" onclick="App.closeApp('chat-app')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg></div>
            <div style="flex:1;" id="chat-title">对方</div>
            <div class="header-right">
                <div class="header-btn" onclick="Chat.clear()"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" /></svg></div>
            </div>
        </div>
        <div class="chat-area" id="chat-area"></div>
        <div class="typing-status" id="typing-status">对方正在输入...</div>
        <div id="emoji-panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>表情包</span><span onclick="App.toggleEmoji()" style="cursor:pointer; font-weight:bold;">✕</span></div>
            <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <div class="input-area">
            <button class="btn-icon" onclick="App.toggleEmoji()"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" /></svg></button>
            <input type="text" id="msg-input" placeholder="输入消息...">
            <button class="btn-icon" onclick="Chat.triggerReply('')"><svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" /></svg></button>
            <button class="btn-send" onclick="Chat.sendMsg()">发送</button>
        </div>
    </div>

    <!-- 页面3：音乐 -->
    <div id="music-app" class="page">
        <div class="header"><div class="back-btn" onclick="App.closeApp('music-app')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg></div><div style="flex:1;">音乐播放器</div></div>
        <div class="music-player">
            <div class="music-title" id="music-title">未在播放</div>
            <div class="music-progress">
                <span id="music-cur-time">00:00</span><input type="range" id="music-bar" value="0" min="0" max="100" step="0.1"><span id="music-total-time">00:00</span>
            </div>
            <div class="music-controls">
                <button id="btn-play" class="music-btn" onclick="Music.togglePlay()">▶</button>
                <button class="music-btn" onclick="Music.playNext()">⏭</button>
            </div>
        </div>
        <div style="padding:10px; display:flex; gap:5px;"><input type="text" id="music-url-input" placeholder="输入音乐直链..." style="flex:1; padding:8px;"><button onclick="Music.addSong()" style="padding:8px;">添加</button></div>
        <div class="list-container" id="music-list"></div>
    </div>

    <!-- 页面4：设置 -->
    <div id="settings-app" class="page">
        <div class="header"><div class="back-btn" onclick="App.closeApp('settings-app')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg></div><div style="flex:1;">设置</div></div>
        <div class="settings-content">
            <h3 style="font-size:16px; margin-bottom:10px;">系统与通知</h3>
            <div class="setting-item">
                <div class="switch-row"><label>桌面消息通知</label><input type="checkbox" class="toggle" id="set-notify" onchange="Settings.save()"></div>
                <div class="switch-row"><label>后台保活</label><input type="checkbox" class="toggle" id="set-keep-alive" onchange="Settings.save()"></div>
            </div>
            <h3 style="font-size:16px; margin:20px 0 10px;">角色资料</h3>
            <div class="setting-item">
                <label>我的名字</label><input type="text" id="set-my-name" onchange="Settings.save()">
                <label style="margin-top:10px;">对方名字</label><input type="text" id="set-bot-name" onchange="Settings.save()">
            </div>
            <h3 style="font-size:16px; margin:20px 0 10px;">外观与交互</h3>
            <div class="setting-item">
                <div class="switch-row"><label>显示头像</label><input type="checkbox" class="toggle" id="set-show-avatar" onchange="Settings.save()"></div>
                <div class="switch-row"><label>显示已读</label><input type="checkbox" class="toggle" id="set-show-read" onchange="Settings.save()"></div>
                <div class="switch-row"><label>发送音效</label><input type="checkbox" class="toggle" id="set-sound" onchange="Settings.save()"></div>
            </div>
            <div class="setting-item">
                <label>字体大小 (<span id="val-size">16</span>px)</label><input type="range" id="set-font-size" min="12" max="24" value="16" oninput="document.getElementById('val-size').innerText=this.value; Settings.save();">
                <label style="margin-top:15px;">自定义字体 (如 '楷体')</label><input type="text" id="set-font-url" onchange="Settings.save()">
                <label style="margin-top:10px;">自定义气泡 CSS</label><input type="text" id="set-bubble-css" placeholder="如: background: red;" onchange="Settings.save()">
            </div>
            <button class="btn-confirm" style="width:100%; padding:15px; border-radius:10px; margin-top:20px; margin-bottom:50px;" onclick="Settings.save(); App.toast('已保存')">保存所有设置</button>
        </div>
    </div>

    <!-- 弹窗与面板 -->
    <div id="action-sheet" onclick="App.hideSheet(event)">
        <div id="action-content" onclick="event.stopPropagation()"></div>
    </div>
    <div id="ask-modal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center;">问问TA</h3>
            <input type="text" id="ask-q" placeholder="你想问什么？">
            <textarea id="ask-opts" placeholder="答案（一行一个）" style="height:100px;"></textarea>
            <div class="modal-btns"><button class="btn-cancel" onclick="App.closeModal('ask-modal')">取消</button><button class="btn-confirm" onclick="Chat.sendSurvey()">发送</button></div>
        </div>
    </div>

    <script>
        // 核心数据
        const App = {
            data: {
                messages: [], emojis: [], musicList: [], currentMusicIdx: -1,
                settings: { myName: '我', botName: '对方', showAvatar: true, showRead: true, sound: true, fontSize: 16, fontUrl: '', bubbleCss: '', desktopNotify: false, keepAlive: false }
            },
            audioCtx: null,
            
            // 初始化与存储
            init: function() {
                try { const saved = localStorage.getItem('my_app_v15'); if(saved) { const p = JSON.parse(saved); this.data = { ...this.data, ...p, settings: { ...this.data.settings, ...p.settings } }; } } catch(e) {}
                this.applyStyles();
                Chat.init();
                Settings.init();
                Music.init();
            },
            save: function() { localStorage.setItem('my_app_v15', JSON.stringify(this.data)); },
            
            // 导航
            openApp: function(id) { document.getElementById(id).classList.add('active'); if(id==='chat-app') Chat.render(); },
            closeApp: function(id) { document.getElementById(id).classList.remove('active'); },
            
            // 弹窗控制
            showSheet: function(html) { document.getElementById('action-content').innerHTML = html; document.getElementById('action-sheet').classList.add('show'); },
            hideSheet: function(e) { if(e.target.id==='action-sheet') document.getElementById('action-sheet').classList.remove('show'); },
            closeModal: function(id) { document.getElementById(id).classList.remove('show'); },
            toast: function(msg) { const d=document.createElement('div'); d.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;'; d.innerText=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 1500); },
            
            // 表情包
            toggleEmoji: function() {
                const p = document.getElementById('emoji-panel');
                p.classList.toggle('show');
                if(p.classList.contains('show')) {
                    const g = document.getElementById('emoji-grid');
                    g.innerHTML = App.data.emojis.map(url => `<img src="${url}" onclick="Chat.sendImg('${url}')">`).join('') || '<div style="text-align:center;color:#888;width:100%;">暂无表情包，请去设置添加</div>';
                }
            },
            
            // 样式应用
            applyStyles: function() {
                const s = this.data.settings;
                document.documentElement.style.setProperty('--font-size-base', s.fontSize + 'px');
                if(s.fontUrl) document.documentElement.style.setProperty('--custom-font', s.fontUrl);
                let b = document.getElementById('dynamic-bubble-style');
                if(!b) { b = document.createElement('style'); b.id = 'dynamic-bubble-style'; document.head.appendChild(b); }
                b.innerHTML = s.bubbleCss ? `.msg { ${s.bubbleCss} }` : '';
            }
        };

        // 聊天模块
        const Chat = {
            init: function() { this.render(); },
            clear: function() { if(confirm('清空聊天记录？')) { App.data.messages = []; this.render(); App.save(); } },
            sendMsg: function() {
                const i = document.getElementById('msg-input');
                if(!i.value.trim()) return;
                App.data.messages.push({ role: 'user', content: i.value.trim(), time: Date.now() });
                i.value = ''; this.render(); App.save();
                this.triggerReply();
            },
            sendImg: function(url) {
                App.data.messages.push({ role: 'user', content: url, isImg: true, time: Date.now() });
                App.toggleEmoji(); this.render(); App.save(); this.triggerReply();
            },
            sendSurvey: function() {
                const q = document.getElementById('ask-q').value.trim();
                const opts = document.getElementById('ask-opts').value.split('\n').filter(x=>x.trim());
                if(!q || opts.length===0) return App.toast('请填写完整');
                
                const selected = opts[Math.floor(Math.random()*opts.length)];
                App.data.messages.push({ role: 'user', type: 'survey', question: q, options: opts, selected: selected, time: Date.now() });
                App.closeModal('ask-modal'); this.render(); App.save();
            },
            triggerReply: function() {
                document.getElementById('typing-status').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('typing-status').style.display = 'none';
                    const texts = ['你好', '收到', '今天过得怎么样？', '嗯嗯', '好的'];
                    const reply = texts[Math.floor(Math.random()*texts.length)];
                    App.data.messages.push({ role: 'other', content: reply, time: Date.now() });
                    this.render(); App.save();
                    if(App.data.settings.sound) this.playSound();
                }, 1500);
            },
            playSound: function() {
                try {
                    if(!App.audioCtx) App.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                    const o = App.audioCtx.createOscillator(); o.type='sine'; o.frequency.value=800; o.connect(App.audioCtx.destination); o.start(); setTimeout(()=>o.stop(), 100);
                } catch(e){}
            },
            render: function() {
                const area = document.getElementById('chat-area');
                const s = App.data.settings;
                let html = '';
                App.data.messages.forEach((m, i) => {
                    const isMe = m.role === 'user';
                    if(m.type === 'survey') {
                        let opts = m.options.map((o, idx) => {
                            const isSel = o === m.selected;
                            return `<div style="border:1px solid ${isSel?'#333':'#ddd'}; padding:8px; margin-bottom:5px; border-radius:6px; display:flex; justify-content:space-between; background:${isSel?'#f0f0f0':'transparent'};"><span>${String.fromCharCode(65+idx)} ${o}</span> ${isSel?'<b>✓</b>':''}</div>`;
                        }).join('');
                        html += `<div class="msg-row ${m.role}"><div class="msg ${m.role}" style="width:250px;"><b>问问TA</b><br>${m.question}<div style="margin-top:10px;">${opts}</div></div></div>`;
                    } else {
                        const content = m.isImg ? `<img src="${m.content}">` : m.content;
                        const av = s.showAvatar ? `<img class="avatar" src="${isMe?'https://api.dicebear.com/7.x/bottts/svg?seed=me':'https://api.dicebear.com/7.x/bottts/svg?seed=bot'}" onclick="App.toast('拍一拍')">` : '';
                        html += `
                        <div class="msg-row ${m.role}">
                            ${!isMe ? av : ''}
                            <div class="msg-content-wrapper">
                                <div class="msg-name">${isMe?s.myName:s.botName}</div>
                                <div class="msg ${m.role}" onclick="Chat.showActions(${i})">${content}</div>
                                ${isMe && s.showRead ? `<div class="read-status show">已读</div>` : ''}
                            </div>
                            ${isMe ? av : ''}
                        </div>`;
                    }
                });
                area.innerHTML = html;
                area.scrollTop = area.scrollHeight;
            },
            showActions: function(index) {
                const m = App.data.messages[index];
                if(m.role !== 'user') return;
                App.showSheet(`
                    <div class="action-btn" onclick="App.data.messages.splice(${index},1); Chat.render(); App.save(); App.hideSheet({target:{id:'action-sheet'}})">删除</div>
                    <div class="action-btn" onclick="document.getElementById('ask-modal').classList.add('show'); App.hideSheet({target:{id:'action-sheet'}})">问问TA</div>
                    <div class="action-cancel" onclick="App.hideSheet({target:{id:'action-sheet'}})">取消</div>
                `);
            }
        };

        // 音乐模块
        const Music = {
            audio: new Audio(),
            init: function() {
                this.audio.addEventListener('timeupdate', () => {
                    if(!this.audio.duration) return;
                    document.getElementById('music-bar').value = (this.audio.currentTime / this.audio.duration) * 100;
                    document.getElementById('music-cur-time').innerText = this.format(this.audio.currentTime);
                    document.getElementById('music-total-time').innerText = this.format(this.audio.duration);
                });
                this.audio.addEventListener('ended', () => this.playNext());
                this.renderList();
            },
            format: function(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`; },
            addSong: function() {
                const url = document.getElementById('music-url-input').value.trim();
                if(!url) return;
                App.data.musicList.push({ name: '网络音乐 ' + (App.data.musicList.length+1), url });
                document.getElementById('music-url-input').value = '';
                this.renderList(); App.save();
            },
            renderList: function() {
                document.getElementById('music-list').innerHTML = App.data.musicList.map((m, i) => `
                    <div class="card-item"><span>${m.name}</span><div><button onclick="Music.play(${i})">播放</button> <button onclick="App.data.musicList.splice(${i},1); Music.renderList(); App.save();">删除</button></div></div>
                `).join('');
            },
            play: function(i) {
                App.data.currentMusicIdx = i;
                this.audio.src = App.data.musicList[i].url;
                this.audio.play();
                document.getElementById('music-title').innerText = App.data.musicList[i].name;
                document.getElementById('btn-play').innerText = '⏸';
            },
            togglePlay: function() {
                if(!this.audio.src) return;
                if(this.audio.paused) { this.audio.play(); document.getElementById('btn-play').innerText = '⏸'; }
                else { this.audio.pause(); document.getElementById('btn-play').innerText = '▶'; }
            },
            playNext: function() {
                if(App.data.musicList.length === 0) return;
                let next = App.data.currentMusicIdx + 1;
                if(next >= App.data.musicList.length) next = 0;
                this.play(next);
            }
        };

        // 设置模块
        const Settings = {
            init: function() {
                const s = App.data.settings;
                document.getElementById('set-my-name').value = s.myName;
                document.getElementById('set-bot-name').value = s.botName;
                document.getElementById('set-show-avatar').checked = s.showAvatar;
                document.getElementById('set-show-read').checked = s.showRead;
                document.getElementById('set-sound').checked = s.sound;
                document.getElementById('set-font-size').value = s.fontSize;
                document.getElementById('val-size').innerText = s.fontSize;
                document.getElementById('set-font-url').value = s.fontUrl;
                document.getElementById('set-bubble-css').value = s.bubbleCss;
            },
            save: function() {
                const s = App.data.settings;
                s.myName = document.getElementById('set-my-name').value;
                s.botName = document.getElementById('set-bot-name').value;
                s.showAvatar = document.getElementById('set-show-avatar').checked;
                s.showRead = document.getElementById('set-show-read').checked;
                s.sound = document.getElementById('set-sound').checked;
                s.fontSize = parseInt(document.getElementById('set-font-size').value);
                s.fontUrl = document.getElementById('set-font-url').value;
                s.bubbleCss = document.getElementById('set-bubble-css').value;
                s.desktopNotify = document.getElementById('set-notify').checked;
                s.keepAlive = document.getElementById('set-keep-alive').checked;
                
                App.applyStyles(); App.save(); Chat.render();
                document.getElementById('chat-title').innerText = s.botName;
            }
        };

        // 启动
        window.onload = function() { App.init(); };
    </script>
</body>
</html>
