<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>爱恋</title>
<style>
:root{--bg:#f5f5f5;--chatbg:#ededed;--text:#111;--u:#333;--ut:#fff;--o:#fff;--ot:#111;--hbg:#f5f5f5;--border:#dcdcdc;--accent:#888;--font:"SimSun",serif;}
[data-theme="dark"]{--bg:#000;--chatbg:#111;--text:#eee;--u:#555;--ut:#fff;--o:#222;--ot:#eee;--hbg:#111;--border:#333;--accent:#666;}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-size:16px;user-select:none;}
svg{fill:currentColor;width:24px;height:24px;}img{object-fit:cover;}
.app-icon,.back-btn,.header-btn,.btn-icon,.btn-send,.panel-action,.action-btn,.emoji-tab-btn,.ask-tab,.btn-tool,.call-btn,.card-actions span,.list-item,.group-title,.toggle{cursor:pointer;touch-action:manipulation;}
#home{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:60px 20px 20px;align-content:start;height:100%;overflow-y:auto;}
.icon{background:var(--hbg);border-radius:24px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.05);border:1px solid var(--border);}
.icon span{font-size:13px;margin-top:10px;font-weight:bold;}.icon:active{transform:scale(.92);}
.page{display:none;flex-direction:column;height:100%;background:var(--bg);position:absolute;top:0;left:0;width:100%;z-index:10;}
.hd{padding:15px 20px;padding-top:max(15px,env(safe-area-inset-top));background:var(--hbg);display:flex;align-items:center;border-bottom:1px solid var(--border);font-weight:bold;font-size:17px;flex-shrink:0;}
.bk{margin-right:15px;padding:5px;display:flex;}.hr{display:flex;gap:15px;}.hb{padding:5px;display:flex;}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:15px;background:var(--chatbg);background-size:cover;background-position:center;}
.row{display:flex;width:100%;align-items:flex-start;gap:10px;flex-shrink:0;}.row.user{justify-content:flex-end;}
.avt{width:38px;height:38px;border-radius:6px;background:#ddd;}
.wrap{display:flex;flex-direction:column;max-width:75%;position:relative;}.row.user .wrap{align-items:flex-end;}
.name{font-size:12px;color:#888;margin-bottom:3px;}
.msg{padding:10px 14px;border-radius:12px;line-height:1.5;word-break:break-all;position:relative;border:1px solid transparent;}
.msg.user{background:var(--u);color:var(--ut);border-top-right-radius:2px;}
.msg.other{background:var(--o);color:var(--ot);border-top-left-radius:2px;border-color:var(--border);}
.msg img{max-width:100%;max-height:200px;border-radius:8px;margin-top:5px;display:block;}
.sys{text-align:center;font-size:12px;color:#888;margin:10px 0;width:100%;}
.inp{padding:10px 15px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--hbg);display:flex;gap:10px;align-items:center;border-top:1px solid var(--border);flex-shrink:0;}
.inp input{flex:1;padding:10px 15px;border:1px solid var(--border);border-radius:8px;outline:none;font-size:15px;background:var(--bg);color:var(--text);}
.btn{border:none;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;padding:5px;}
.send{padding:0;background:var(--u);color:var(--ut);border:none;border-radius:8px;width:50px;height:38px;font-weight:bold;}
#emoji-p,#extra-p{display:none;background:var(--hbg);border-top:1px solid var(--border);padding:15px;flex-shrink:0;}
#extra-p{height:130px;gap:25px;overflow-x:auto;}
#emoji-p{height:300px;flex-direction:column;padding:0;}
.panel{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;}
.ibox{width:60px;height:60px;background:var(--bg);border-radius:12px;border:1px solid var(--border);display:flex;justify-content:center;align-items:center;font-size:24px;}
.e-hd{display:flex;border-bottom:1px solid var(--border);padding:10px 15px;gap:15px;}
.e-btn{padding:6px 15px;border-radius:20px;font-size:14px;font-weight:bold;color:var(--accent);border:1px solid transparent;}
.e-btn.active{background:var(--bg);color:var(--text);border-color:var(--border);}
.e-area{flex:1;overflow-y:auto;padding:10px 15px;display:none;}
.e-area.active{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
.e-area img{width:calc(25% - 10px);aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:5px;}
.e-txt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:20px;}
.ls{flex:1;overflow-y:auto;padding:15px;padding-bottom:80px;}
.item{background:var(--hbg);padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.acts{display:flex;gap:8px;}.acts span{color:var(--accent);font-size:12px;}
.bar{position:absolute;bottom:0;left:0;width:100%;background:var(--hbg);padding:15px;padding-bottom:max(15px,env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--border);z-index:5;}
.bar input{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--bg);color:var(--text);}
.bar button{background:var(--u);color:var(--ut);border:none;border-radius:8px;padding:0 20px;}
.set-c{padding:20px;overflow-y:auto;flex:1;padding-bottom:100px;}
.s-item{margin-bottom:20px;background:var(--hbg);padding:15px;border-radius:12px;border:1px solid var(--border);}
.s-item label{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:bold;font-size:14px;align-items:center;}
.s-item input[type="text"],.s-item input[type="number"],.s-item select,.s-item textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-top:5px;background:var(--bg);color:var(--text);outline:none;}
.s-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.toggle{appearance:none;width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;outline:none;transition:.3s;}
.toggle:checked{background:#333;}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s;}
.toggle:checked::after{transform:translateX(20px);}
.mk{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;}
.mk.show{display:flex;}.mc{background:var(--hbg);width:90%;max-width:400px;border-radius:15px;padding:20px;display:flex;flex-direction:column;gap:15px;border:1px solid var(--border);}
.mc textarea,.mc input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.mc textarea{height:120px;resize:none;}.mb{display:flex;gap:10px;}.mb button{flex:1;padding:12px;border:none;border-radius:8px;}
.c{background:var(--border);color:var(--text);}.ok{background:var(--u);color:var(--ut);}
#sheet{display:none;position:fixed;bottom:0;left:0;width:100%;background:var(--bg);z-index:210;border-top-left-radius:15px;border-top-right-radius:15px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--border);}
#sheet.show{display:block;}.act{padding:16px;text-align:center;border-bottom:1px solid var(--border);}.ac{margin-top:8px;border:none;border-top:8px solid var(--border);font-weight:bold;}
#call{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
#call.show{display:flex;}
#lvid{position:absolute;top:max(40px,env(safe-area-inset-top));right:20px;width:110px;height:160px;border-radius:12px;object-fit:cover;background:#222;border:1px solid #444;display:none;z-index:10;transform:scaleX(-1);transition:all .3s;cursor:pointer;}
#lvid.main{top:0;left:0;width:100%;height:100%;border-radius:0;z-index:20;transform:none;}
#cinfo{display:flex;flex-direction:column;align-items:center;gap:20px;z-index:5;transition:all .3s;}
#cinfo.pip{position:absolute;top:max(40px,env(safe-area-inset-top));right:20px;width:110px;height:160px;border-radius:12px;background:#222;z-index:10;justify-content:center;gap:5px;}
#cinfo.pip img{width:44px;height:44px;border-radius:50%;} #cinfo.pip .cname{font-size:12px;} #cinfo.pip .cst{display:none;}
.cavt{width:120px;height:120px;border-radius:50%;border:3px solid #333;}
.cname{font-size:24px;font-weight:bold;}.cst{font-size:16px;color:#aaa;}
.cacts{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;padding:0 40px;z-index:505;}
.cbtn{width:60px;height:60px;border-radius:50%;color:#fff;border:none;font-size:16px;}
.min-btn{position:absolute;top:max(40px,env(safe-area-inset-top));right:20px;z-index:510;background:rgba(0,0,0,.5);width:44px;height:44px;border-radius:50%;color:#fff;border:none;display:flex;justify-content:center;align-items:center;}
#mini{position:fixed;top:max(40px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--hbg);border-radius:30px;padding:8px 20px 8px 8px;display:none;align-items:center;gap:12px;z-index:600;border:1px solid var(--border);}
#mini img{width:36px;height:36px;border-radius:50%;}
</style>
</head>

<div id="letter" class="page"><div class="hd"><div class="bk" onclick="closeApp('letter')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><div style="flex:1;">信箱</div><div style="font-size:24px;" onclick="L.write()">+</div></div><div class="ls" id="l-list"></div></div>
<div id="set" class="page"><div class="hd"><div class="bk" onclick="closeApp('set')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><div style="flex:1;">设置</div></div>
<div class="set-c">
<div class="s-item"><label>我的余额</label><input type="number" id="s-bal" step="0.01"></div>
<div class="s-item"><label>对方名字</label><input type="text" id="s-bname"></div>
<div class="s-item"><div class="s-row"><label>桌面通知</label><input type="checkbox" class="toggle" id="s-noti" onchange="if(this.checked&&Notification.permission!=='granted')Notification.requestPermission()"></div><div class="s-row"><label>后台保活</label><input type="checkbox" class="toggle" id="s-keep" onchange="if(this.checked)document.getElementById('keep').play()"></div></div>
<div class="s-item"><div class="s-row"><label>夜间模式</label><input type="checkbox" class="toggle" id="s-dark" onchange="document.documentElement.setAttribute('data-theme',this.checked?'dark':'light')"></div></div>
<button class="ok" style="width:100%;padding:15px;border:none;border-radius:10px;margin-bottom:50px;" onclick="S.save()">保存设置</button>
</div></div>
<div id="batch-m" class="mk"><div class="mc"><textarea id="b-txt" placeholder="一行一个"></textarea><div class="mb"><button class="c" onclick="closeM('batch-m')">取消</button><button class="ok" onclick="C.doBatch()">确认</button></div></div></div>
<div id="pat-m" class="mk"><div class="mc"><textarea id="pb-txt" placeholder="一行一个"></textarea><div class="mb"><button class="c" onclick="closeM('pat-m')">取消</button><button class="ok" onclick="P.doBatch()">确认</button></div></div></div>
<div id="eb-m" class="mk"><div class="mc"><textarea id="eb-txt" placeholder="一行一个"></textarea><div class="mb"><button class="c" onclick="closeM('eb-m')">取消</button><button class="ok" onclick="E.doBatch('emo')">确认</button></div></div></div>
<div id="tb-m" class="mk"><div class="mc"><textarea id="tb-txt" placeholder="一行一个"></textarea><div class="mb"><button class="c" onclick="closeM('tb-m')">取消</button><button class="ok" onclick="E.doBatch('txt')">确认</button></div></div></div>
<div id="ask-m" class="mk"><div class="mc"><input type="text" id="ask-q" placeholder="问题"><textarea id="ask-o" placeholder="选项(一行一个)"></textarea><div class="mb"><button class="c" onclick="closeM('ask-m')">取消</button><button class="ok" onclick="Chat.sendSurvey()">发送</button></div></div></div>
<div id="money-m" class="mk"><div class="mc"><input type="number" id="money-a" placeholder="金额"><input type="text" id="money-n" placeholder="备注"><div class="mb"><button class="c" onclick="closeM('money-m')">取消</button><button class="ok" onclick="Chat.doMoney()">塞钱</button></div></div></div>
<div id="w-m" class="mk"><div class="mc"><input type="text" id="w-t" placeholder="标题"><textarea id="w-c" placeholder="内容"></textarea><div class="mb"><button class="c" onclick="closeM('w-m')">取消</button><button class="ok" onclick="L.doSend()">寄出</button></div></div></div>
<div id="r-m" class="mk"><div class="mc"><h3 id="r-title"></h3><div id="r-content" style="white-space:pre-wrap;padding:10px;background:var(--bg);border-radius:8px;"></div><div class="mb"><button class="c" onclick="closeM('r-m')">关闭</button></div></div></div>
<div id="sheet"><div id="sheet-c"></div></div>
<div id="mini" onclick="Call.expand()"><img id="mini-a"><span>通话中...</span></div>
<div id="call">
<video id="rvid" autoplay playsinline muted style="position:absolute;width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1);"></video>
<div id="cinfo"><img id="cavt" class="cavt"><div id="cname" class="cname">对方</div><div id="cst" class="cst">正在呼叫...</div></div>
<video id="lvid" autoplay playsinline muted onclick="Call.toggleView()"></video>
<button class="min-btn" onclick="Call.minimize()" style="top:40px;right:20px;">➖</button>
<button class="min-btn" id="btn-cam" onclick="Call.toggleCam()" style="top:40px;left:80px;display:none;">📷</button>
<button class="min-btn" id="btn-sw" onclick="Call.switchCam()" style="top:40px;left:20px;display:none;">🔄</button>
<div class="cacts" id="c-act"><button class="cbtn" style="background:#ff3b30;" onclick="Call.hangup()" id="btn-hang">取消</button></div>
</div>
<input type="file" id="gallery" accept="image/*" style="display:none" onchange="E.local(this)">
<input type="file" id="camera" accept="image/*" capture="environment" style="display:none" onchange="E.local(this)">
<script>
const DB='app_v1', data={msgs:[],cards:[],pats:['拍了拍'],emojis:{pic:[],emo:['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🧐','🤓','😎','🤩','🥳'],txt:['(￣▽￣)','(✿◡‿◡)']},letters:[],music:[],wallet:{my:520.22},settings:{myName:'我',botName:'对方',botAvatar:'',showAvatar:true,showName:true,showRead:true,noti:false,keep:false,dark:false}};
const $=id=>document.getElementById(id); let saveTo;
const save=()=>{clearTimeout(saveTo);saveTo=setTimeout(()=>localStorage.setItem(DB,JSON.stringify(data)),500)};
const toast=m=>{const e=document.createElement('div');e.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;pointer-events:none;';e.innerText=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)};
const app=id=>{closeAll();$(id).style.display='flex';if(id==='chat')Chat.render();if(id==='set')S.render();if(id==='cards')C.render();if(id==='pat')P.render();if(id==='music')M.render();if(id==='emoji')E.renderMgr();if(id==='letter')L.render()};
const closeApp=id=>{$(id).style.display='none';closeAll()};
const closeAll=()=>{$('emoji-p').style.display='none';$('extra-p').style.display='none';$('sheet').classList.remove('show');document.querySelectorAll('.mk').forEach(m=>m.classList.remove('show'))};
const closeM=id=>$(id).classList.remove('show');
const toggle=id=>{const p=$(id);const isNone=p.style.display==='none'||!p.style.display;p.style.display=isNone?'flex':'none';if(isNone){$('emoji-p').style.display=id==='emoji-p'?'flex':'none';$('extra-p').style.display=id==='extra-p'?'flex':'none';}};
try{const s=localStorage.getItem(DB);if(s){const p=JSON.parse(s);Object.assign(data,p);Object.assign(data.settings,p.settings||{});}}catch(e){}

const Chat={
render(){const a=$('c-area');a.innerHTML='';data.msgs.forEach((m,i)=>{
if(m.role==='sys'){const d=document.createElement('div');d.className='sys';d.innerText=m.content;a.appendChild(d);return;}
const r=document.createElement('div');r.className='row '+m.role;
const isMe=m.role==='user', avt=isMe?data.settings.myAvatar:data.settings.botAvatar, name=isMe?data.settings.myName:data.settings.botName;
let avH=data.settings.showAvatar?`<img class="avt" src="${avt||'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ccc\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'}">`:'';
let nameH=data.settings.showName?`<div class="name">${name}</div>`:'';
let readH=(isMe&&data.settings.showRead)?`<div style="font-size:11px;color:#999;text-align:right;margin-top:2px;">已读</div>`:'';
let cH='';
if(m.type==='red'||m.type==='transfer'){
cH=`<div class="msg ${m.role}" style="background:${m.type==='red'?'#fa5151':'#fa9d3b'};color:#fff;padding:15px;border-radius:10px;width:200px;"><div style="font-size:24px;">${m.type==='red'?'🧧':'💸'}</div><div>${m.note}</div><div>¥${m.amount}</div></div>`;
}else if(m.type==='survey'){
cH=`<div class="msg ${m.role}" style="padding:15px;"><b>${m.q}</b><br><br>${m.opts.map(o=>`<div style="border:1px solid var(--border);padding:5px;margin-bottom:5px;border-radius:5px;${o.sel?'background:var(--hbg)':''}">${o.t} ${o.sel?'✓':''}</div>`).join('')}</div>`;
}else{
cH=`<div class="msg ${m.role}">${m.isImg?`<img src="${m.c}">`:m.c}</div>`;
}
r.innerHTML=`${!isMe?avH:''}<div class="wrap">${nameH}${cH}${readH}</div>${isMe?avH:''}`;a.appendChild(r);
});
a.scrollTop=a.scrollHeight;},
send(){const v=$('msg-in').value.trim();if(!v)return;data.msgs.push({id:Date.now(),role:'user',c:v});$('msg-in').value='';this.render();save();this.trigger(v);},
sendImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{data.msgs.push({id:Date.now(),role:'user',isImg:true,c:e.target.result});this.render();save();this.trigger('');};r.readAsDataURL(f);i.value='';},
trigger(txt,pro=false){const ac=Math.random()*3000+1000;setTimeout(()=>{
let c='嗯。';const arr=data.cards.flatMap(x=>x.items);if(arr.length)c=arr[Math.floor(Math.random()*arr.length)];
data.msgs.push({id:Date.now(),role:'other',c});this.render();save();
if(document.hidden&&data.settings.noti&&Notification.permission==='granted')new Notification('新消息',{body:c});
},ac);},
sendSurvey(){const q=$('ask-q').value,o=$('ask-o').value.split('\n').filter(x=>x.trim());if(!q||o.length<2)return toast('请填全');this.render();this.closeModal;data.msgs.push({id:Date.now(),role:'user',type:'survey',q,opts:o.map(t=>({t,sel:false}))});$('ask-q').value='';$('ask-o').value='';closeM('ask-m');this.render();save();
setTimeout(()=>{const m=data.msgs.find(x=>x.type==='survey'&&!x.done);if(m){m.done=true;m.opts[0].sel=true;this.render();save();}},3000);},
doMoney(){const a=$('money-a').value,n=$('money-n').value;if(!a)return;data.msgs.push({id:Date.now(),role:'user',type:'red',amount:a,note:n||'恭喜发财'});$('money-a').value='';$('money-n').value='';closeM('money-m');this.render();save();}
};

const C={
render(){const s=$('c-search').value.toLowerCase(),l=$('c-list');l.innerHTML='';
let g=data.cards.find(x=>x.group==='默认');if(!g){g={group:'默认',items:[]};data.cards.push(g);}
g.items.forEach((it,i)=>{if(s&&!it.toLowerCase().includes(s))return;l.innerHTML+=`<div class="item"><span>${it}</span><div class="acts"><span onclick="C.del(${i})">删除</span></div></div>`;});},
add(){const v=$('c-in').value;if(!v)return;data.cards[0].items.push(v);$('c-in').value='';this.render();save();},
del(i){data.cards[0].items.splice(i,1);this.render();save();},
batch(){closeAll();$('batch-m').classList.add('show');},
doBatch(){const v=$('b-txt').value.split('\n').filter(x=>x.trim());v.forEach(x=>data.cards[0].items.push(x));$('b-txt').value='';closeM('batch-m');this.render();save();}
};

const P={
render(){const l=$('p-list');l.innerHTML='';data.pats.forEach((p,i)=>l.innerHTML+=`<div class="item"><span>${p}</span><div class="acts"><span onclick="P.del(${i})">删除</span></div></div>`);},
add(){const v=$('p-in').value;if(!v)return;data.pats.push(v);$('p-in').value='';this.render();save();},
del(i){data.pats.splice(i,1);this.render();save();},
batch(){closeAll();$('pat-m').classList.add('show');},
doBatch(){const v=$('pb-txt').value.split('\n').filter(x=>x.trim());v.forEach(x=>data.pats.push(x));$('pb-txt').value='';closeM('pat-m');this.render();save();}
};

const E={
tab(t){document.querySelectorAll('#emoji-p .e-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#emoji-p .e-area').forEach(a=>a.classList.remove('active'));event.target.classList.add('active');$('e-'+t).classList.add('active');$('e-add-box').style.display=t==='pic'?'flex':'none';this.renderPanel();},
renderPanel(){const p=$('e-pic');p.innerHTML='';data.emojis.pic.forEach(u=>p.innerHTML+=`<img src="${u}" onclick="Chat.sendImgStr('${u}')">`);
const e=$('e-emo');e.innerHTML='';data.emojis.emo.forEach(x=>e.innerHTML+=`<div class="e-txt" onclick="$('msg-in').value+='${x}'">${x}</div>`);
const t=$('e-txt');t.innerHTML='';data.emojis.txt.forEach(x=>t.innerHTML+=`<div class="e-txt" onclick="$('msg-in').value+='${x}'">${x}</div>`);},
renderMgr(){const p=$('m-pic-list');p.innerHTML='';data.emojis.pic.forEach((u,i)=>p.innerHTML+=`<div style="position:relative"><img src="${u}" style="width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:8px;"><div style="position:absolute;top:0;right:0;background:red;color:#fff;padding:2px 5px;border-radius:50%;" onclick="E.delPic(${i})">✕</div></div>`);
const e=$('m-emo-list');e.innerHTML='';data.emojis.emo.forEach((x,i)=>e.innerHTML+=`<div class="item"><span>${x}</span><div class="acts"><span onclick="E.delEmo(${i})">删除</span></div></div>`);
const t=$('m-txt-list');t.innerHTML='';data.emojis.txt.forEach((x,i)=>t.innerHTML+=`<div class="item"><span>${x}</span><div class="acts"><span onclick="E.delTxt(${i})">删除</span></div></div>`);},
mgrTab(t){document.querySelectorAll('#emoji .e-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#emoji .e-area').forEach(a=>a.style.display='none');$('m-'+t).style.display='flex';event.target.classList.add('active');this.renderMgr();},
showMenu(){const s=$('sheet');$('sheet-c').innerHTML=`<div class="act" onclick="$('gallery').click();closeAll()">照片图库</div><div class="act" onclick="$('camera').click();closeAll()">拍照</div><div class="ac" onclick="closeAll()">取消</div>`;s.classList.add('show');},
local(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{data.emojis.pic.push(e.target.result);save();this.renderMgr();this.renderPanel();};r.readAsDataURL(f);i.value='';},
add(t){const el=$(t==='emo'?'e-in':'t-in');const v=el.value;if(!v)return;data.emojis[t].push(v);el.value='';save();this.renderMgr();},
batch(t){closeAll();$(t==='emo'?'eb-m':'tb-m').classList.add('show');},
doBatch(t){const v=$(t==='emo'?'eb-txt':'tb-txt').value.split('\n').filter(x=>x.trim());v.forEach(x=>data.emojis[t].push(x));closeM(t==='emo'?'eb-m':'tb-m');save();this.renderMgr();},
delPic(i){data.emojis.pic.splice(i,1);save();this.renderMgr();},delEmo(i){data.emojis.emo.splice(i,1);save();this.renderMgr();},delTxt(i){data.emojis.txt.splice(i,1);save();this.renderMgr();}
};

const L={
render(){const l=$('l-list');l.innerHTML='';data.letters.forEach(x=>l.innerHTML+=`<div class="item" onclick="L.read(${x.id})"><span>${x.t}</span></div>`);},
write(){closeAll();$('w-m').classList.add('show');},
doSend(){const t=$('w-t').value,c=$('w-c').value;if(!c)return;data.letters.push({id:Date.now(),t,c});$('w-t').value='';$('w-c').value='';closeM('w-m');this.render();save();},
read(id){const x=data.letters.find(l=>l.id===id);if(!x)return;$('r-title').innerText=x.t;$('r-content').innerText=x.c;closeAll();$('r-m').classList.add('show');}
};

const M={
render(){const l=$('m-list');l.innerHTML='';data.music.forEach((m,i)=>l.innerHTML+=`<div class="item" onclick="M.play(${i})"><span>${m.name}</span></div>`);},
add(){const u=$('m-url').value;if(!u)return;data.music.push({name:'网络音乐',url:u});$('m-url').value='';this.render();save();},
play(i){const a=$('ga');a.src=data.music[i].url;a.play();$('m-title').innerText=data.music[i].name;$('m-play').innerText='⏸';a.onended=()=>this.next();},
toggle(){const a=$('ga');if(a.paused){a.play();$('m-play').innerText='⏸';}else{a.pause();$('m-play').innerText='▶';}},
next(){if(data.music.length>1)this.play((data.music.findIndex(m=>m.url===$('ga').src)+1)%data.music.length);},
prev(){if(data.music.length>1)this.play((data.music.findIndex(m=>m.url===$('ga').src)-1+data.music.length)%data.music.length);}
};

const S={
render(){$('s-bal').value=data.wallet.my;$('s-bname').value=data.settings.botName;$('s-noti').checked=data.settings.noti;$('s-keep').checked=data.settings.keep;$('s-dark').checked=data.settings.dark;},
save(){data.wallet.my=$('s-bal').value;data.settings.botName=$('s-bname').value;data.settings.noti=$('s-noti').checked;data.settings.keep=$('s-keep').checked;data.settings.dark=$('s-dark').checked;save();toast('已保存');}
};

const Call={
isVid:false,t:null,sec:0,stream:null,mode:'user',
start(v){this.isVid=v;this.sec=0;closeAll();$('call').classList.add('show');$('cavt').src=data.settings.botAvatar||'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
$('cname').innerText=data.settings.botName;$('cst').innerText='正在呼叫...';$('c-act').innerHTML=`<button class="cbtn" style="background:#ff3b30;width:100px;border-radius:30px;" onclick="Call.hangup()">取消</button>`;
$('lvid').style.display='none';$('cinfo').className='';$('btn-cam').style.display=this.isVid?'flex':'none';$('btn-sw').style.display='none';
setTimeout(()=>{
$('cst').innerText='00:00';$('btn-hang').innerText='挂断';$('btn-hang').style.width='60px';$('btn-hang').style.borderRadius='50%';
this.t=setInterval(()=>{this.sec++;$('cst').innerText=Math.floor(this.sec/60).toString().padStart(2,'0')+':'+(this.sec%60).toString().padStart(2,'0');},1000);
if(this.isVid)this.cam();
},3000);},
cam(){navigator.mediaDevices.getUserMedia({video:{facingMode:this.mode}}).then(s=>{this.stream=s;$('lvid').srcObject=s;$('lvid').style.display='block';$('rvid').srcObject=s;$('rvid').style.display='block';$('cinfo').className='pip';$('btn-sw').style.display='flex';}).catch(e=>toast('无摄像头权限'));},
toggleCam(){if($('lvid').style.display==='none'){this.cam();}else{$('lvid').style.display='none';$('rvid').style.display='none';$('cinfo').className='';if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}}},
switchCam(){this.mode=this.mode==='user'?'environment':'user';this.cam();},
toggleView(){const l=$('lvid'),i=$('cinfo');if(l.classList.contains('main')){l.classList.remove('main');i.className='pip';}else{l.classList.add('main');i.className='';}},
hangup(){clearInterval(this.t);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}$('call').classList.remove('show');$('mini').style.display='none';},
minimize(){$('call').classList.remove('show');$('mini').style.display='flex';},
expand(){$('mini').style.display='none';$('call').classList.add('show');}
};

function openMoney(t){closeAll();$('money-m').classList.add('show');}
Chat.render();C.render();P.render();M.render();L.render();S.render();
</script>
</body>
